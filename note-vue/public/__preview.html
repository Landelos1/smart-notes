<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>预览</title>
  <script>
    // __TEMP_PREVIEW__ 本地视觉走查用，写完即删
    var p = new URLSearchParams(location.search);
    if (p.get('token')) localStorage.setItem('satoken', p.get('token'));
    var to = p.get('to') || '/';
    location.replace(to);
  </script>
</head>
<body></body>
</html>
