name: Backend build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and package backend
        run: mvn -B -f initialization-note-side/pom.xml -DskipTests package
      - name: Run isolated security and recognition tests
        run: mvn -B -f initialization-note-side/pom.xml -Dtest=UserProfileSecurityTest,StructuredNoteServiceTest test
