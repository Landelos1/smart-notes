name: Frontend build

on:
  push:
    paths:
      - 'note-vue/**'
      - 'art-design-pro/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'note-vue/**'
      - 'art-design-pro/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  user:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: note-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: note-vue/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: art-design-pro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: art-design-pro/pnpm-lock.yaml
      - run: cp .env.example .env.local
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
